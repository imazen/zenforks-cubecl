name: CI

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "**.rs"
      - "**.yml"
      - "**.toml"
      - "!**.md"
      - "!LICENSE-APACHE"
      - "!LICENSE-MIT"
  pull_request:
    types: [opened, synchronize]
    paths:
      - "Cargo.lock"
      - "**.rs"
      - "**.yml"
      - "**.toml"
      - "!**.md"
      - "!LICENSE-APACHE"
      - "!LICENSE-MIT"

env:
  CARGO_TERM_COLOR: always
  RUST_PREVIOUS_VERSION: 1.92.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exists to republish the workflow-level `env.RUST_PREVIOUS_VERSION` as a job
  # output. The `env` context is not available to `jobs.<id>.strategy` but is
  # available to `jobs.<id>.outputs`, so the MSRV leg of linux-std-tests can
  # only reach the value via `needs.prepare-checks.outputs.rust-prev-version`.
  # A job must declare at least one step, hence the echo.
  prepare-checks:
    runs-on: ubuntu-22.04
    outputs:
      rust-prev-version: ${{ env.RUST_PREVIOUS_VERSION }}
    steps:
      - name: Report pinned previous Rust version
        run: echo "RUST_PREVIOUS_VERSION=${RUST_PREVIOUS_VERSION}"

  code-quality:
    runs-on: ubuntu-22.04
    needs: prepare-checks
    strategy:
      matrix:
        rust: [stable]
        include:
          - rust: stable
            toolchain: stable
    steps:
      - name: checkout
        uses: actions/checkout@v6
      # --------------------------------------------------------------------------------
      - name: Install Rust
        uses: tracel-ai/github-actions/install-rust@v10
        with:
          rust-toolchain: ${{ matrix.toolchain }}
          cache-key: ${{ matrix.rust }}-linux
      # --------------------------------------------------------------------------------
      - name: Audit
        run: xtask check audit
      # --------------------------------------------------------------------------------
      - name: Format
        shell: bash
        env:
          # work around for colors
          # see: https://github.com/rust-lang/rustfmt/issues/3385
          TERM: xterm-256color
        run: xtask check format
      # --------------------------------------------------------------------------------
      - name: Lint
        run: xtask check lint
      # --------------------------------------------------------------------------------
      - name: Typos
        uses: tracel-ai/github-actions/check-typos@v10

  documentation:
    runs-on: ubuntu-22.04
    needs: prepare-checks
    strategy:
      matrix:
        rust: [stable]
        include:
          - rust: stable
            toolchain: stable
    steps:
      - name: checkout
        uses: actions/checkout@v6
      # --------------------------------------------------------------------------------
      - name: Install Rust
        uses: tracel-ai/github-actions/install-rust@v10
        with:
          rust-toolchain: ${{ matrix.toolchain }}
          cache-key: ${{ matrix.rust }}-linux
      # --------------------------------------------------------------------------------
      - name: Documentation Build
        run: xtask doc build
      # --------------------------------------------------------------------------------
      - name: Documentation Tests
        run: xtask doc tests

  linux-std-tests:
    # Upstream runs this on tracel's self-provisioned GCP runners
    # (`@id:cubecl-…`, n2-standard-16). Those labels resolve to nothing here, so
    # this fork runs the same suite on a GitHub-hosted runner. Do NOT reintroduce
    # an `if: github.repository == …` guard to silence it — a skipped job reports
    # as a passing run, which is how this suite went unexecuted for months.
    runs-on: ubuntu-24.04
    needs: [prepare-checks, code-quality]
    strategy:
      matrix:
        rust: [stable, prev]
        include:
          - rust: stable
            toolchain: stable
          - rust: prev
            toolchain: ${{ needs.prepare-checks.outputs.rust-prev-version }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      # --------------------------------------------------------------------------------
      - name: Install Rust
        uses: tracel-ai/github-actions/install-rust@v10
        with:
          rust-toolchain: ${{ matrix.toolchain }}
          cache-key: ${{ matrix.rust }}-linux
          apt-packages: build-essential
      # --------------------------------------------------------------------------------
      - name: Install Mesa
        uses: tracel-ai/github-actions/install-mesa@v10
      # --------------------------------------------------------------------------------
      - name: Install Vulkan SDK
        uses: tracel-ai/github-actions/install-vulkan-sdk@v10
      # --------------------------------------------------------------------------------
      - name: Tests
        run: xtask test --ci

  linux-miri-tests:
    # Same GCP-runner substitution as linux-std-tests above.
    runs-on: ubuntu-24.04
    needs: [prepare-checks, code-quality]
    strategy:
      matrix:
        rust: [nightly]
        include:
          - rust: nightly
            toolchain: nightly
    steps:
      - name: checkout
        uses: actions/checkout@v6
      # --------------------------------------------------------------------------------
      - name: Install Rust
        uses: tracel-ai/github-actions/install-rust@v10
        with:
          rust-toolchain: ${{ matrix.toolchain }}
          cache-key: ${{ matrix.rust }}-miri-tests
          enable-cache: false
          apt-packages: build-essential
      # --------------------------------------------------------------------------------
      - name: Install Mesa
        uses: tracel-ai/github-actions/install-mesa@v10
      # --------------------------------------------------------------------------------
      - name: Install Vulkan SDK
        uses: tracel-ai/github-actions/install-vulkan-sdk@v10
      # --------------------------------------------------------------------------------
      - name: Tests
        run: xtask +n test --miri ub-only --ci

